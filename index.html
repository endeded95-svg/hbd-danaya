<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>С днём рождения, Даная!</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #fffdf8;
      color: #4d5a2e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.2svh, 28px);
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 8%, rgba(193, 255, 94, 0.42), transparent 30%),
        radial-gradient(circle at 90% 14%, rgba(255, 102, 179, 0.34), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(218, 255, 154, 0.34), transparent 36%),
        radial-gradient(circle at 50% 42%, rgba(255, 240, 247, 0.48), transparent 38%),
        linear-gradient(180deg, rgba(255,254,251,0.24) 0%, rgba(255,248,252,0.28) 100%);
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.48;
      filter:
        saturate(1.16)
        blur(1.6px)
        brightness(1.12)
        contrast(0.98);
      transform: scale(1.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .bg-overlay::after {
      content: "";
      position: absolute;
      inset: -50%;
      opacity: 0.045;
      background-image:
        repeating-radial-gradient(circle at 0 0, rgba(255,255,255,0.9) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 4px);
      mix-blend-mode: soft-light;
      animation: grainMove 18s steps(4) infinite;
      pointer-events: none;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,245,250,0.10));
      backdrop-filter: blur(2.8px);
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(48px);
      pointer-events: none;
      animation: orbMove 8s ease-in-out infinite;
    }

    .orb.one {
      z-index: 2;
      width: 220px;
      height: 220px;
      left: -90px;
      top: 40px;
      background: rgba(176, 255, 79, 0.44);
    }

    .orb.two {
      z-index: 2;
      width: 230px;
      height: 230px;
      right: -90px;
      top: 210px;
      background: rgba(255, 89, 167, 0.34);
      animation-delay: -2s;
    }

    .orb.three {
      z-index: 2;
      width: 280px;
      height: 280px;
      left: 50%;
      bottom: -160px;
      transform: translateX(-50%);
      background: rgba(205, 255, 122, 0.34);
      animation-delay: -4s;
    }

    @keyframes orbMove {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14px, -12px, 0) scale(1.08); }
    }

    @keyframes titleGradientMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes retroShine {
      0% {
        transform: translateX(-120%) skewX(-18deg);
        opacity: 0;
      }
      18% {
        opacity: 0.76;
      }
      52% {
        transform: translateX(120%) skewX(-18deg);
        opacity: 0.14;
      }
      100% {
        transform: translateX(120%) skewX(-18deg);
        opacity: 0;
      }
    }

    @keyframes grainMove {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(-2%, 1%);
      }
      50% {
        transform: translate(1%, -1.5%);
      }
      75% {
        transform: translate(-1%, 2%);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes titleFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(-0.35deg) scale(1);
      }
      50% {
        transform: translate3d(0, -8px, 0) rotate(0.35deg) scale(1.012);
      }
    }

    .title {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 460px;
      margin: 0;
      padding-bottom: 0.08em;
      text-align: center;
      font-size: clamp(42px, 14vw, 74px);
      line-height: 0.9;
      letter-spacing: -0.07em;
      font-weight: 1000;
      transform-origin: center;
      animation: titleFloat 5.4s ease-in-out infinite;
      will-change: transform;
    }

    .title-name {
      font-family: "Snell Roundhand", "Brush Script MT", "Apple Chancery", "Segoe Script", cursive;
      font-size: 1.12em;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 0.92;
      transform: rotate(-2deg);
      display: inline-block;
      margin-top: 0.02em;
    }

    .title span {
      position: relative;
      display: block;
      padding: 0.02em 0 0.08em;
      background: linear-gradient(
        135deg,
        #ff2f92 0%,
        #ff6eb8 24%,
        #ffffff 46%,
        #f3ffbf 68%,
        #ff2f92 100%
      );
      background-size: 240% 240%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: titleGradientMove 6s ease-in-out infinite;
      filter:
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.28))
        drop-shadow(0 0 22px rgba(255, 120, 190, 0.34))
        drop-shadow(0 8px 28px rgba(255, 79, 162, 0.22));
    }

    .title span::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.0) 35%,
        rgba(255,255,255,0.55) 50%,
        rgba(255,255,255,0.0) 65%,
        transparent 100%
      );
      mix-blend-mode: normal;
      opacity: 0.65;
      transform: translateX(-120%) skewX(-18deg);
      animation: retroShine 4.8s ease-in-out infinite;
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 430px;
      height: min(54svh, 520px);
      min-height: 430px;
      display: grid;
      place-items: center;
      overflow: visible;
      flex: 0 0 auto;
    }

    .bubble-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      overflow: visible;
      pointer-events: none;
    }

    .character-card {
      position: relative;
      z-index: 10;
      width: min(62vw, 252px);
      aspect-ratio: 3 / 5;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(165, 219, 76, 0.34);
      background: rgba(255, 255, 255, 0.90);
      box-shadow:
        0 28px 76px rgba(148, 197, 58, 0.22),
        0 16px 42px rgba(255, 90, 168, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform-origin: center;
      animation:
        cardIn 700ms cubic-bezier(.2,.9,.2,1) both,
        videoCardFloat 5.8s ease-in-out 900ms infinite,
        videoCardGlow 7s ease-in-out 1.2s infinite;
      will-change: transform, box-shadow;
    }

    .character-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .character-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.22),
        rgba(255,232,242,.10) 38%,
        rgba(218,255,169,.10) 72%,
        rgba(0,0,0,.03)
      );
    }

    .bubble {
      position: fixed;
      left: var(--start-x);
      top: var(--start-y);
      z-index: 1000;
      max-width: min(170px, calc(100vw - 48px));
      padding: 10px 13px;
      border-radius: 18px;
      border: 1px solid rgba(170, 223, 84, 0.38);
      background: rgba(255, 252, 253, 0.62);
      box-shadow:
        0 16px 36px rgba(147, 201, 57, 0.12),
        0 8px 22px rgba(255, 88, 168, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.42);
      color: #5b6238;
      font-size: clamp(11px, 3vw, 12px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      opacity: 0;
      will-change: transform, opacity;
      transform: translate3d(-50%, -50%, 0) scale(0.76);
      animation: bubbleFloat var(--duration) cubic-bezier(.16,.84,.28,1) forwards;
    }

    .bubble::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0.72;
      background: linear-gradient(
        135deg,
        rgba(195, 255, 112, .28),
        rgba(255,255,255,.08),
        rgba(255, 136, 196, .26)
      );
      pointer-events: none;
    }

    .bubble span {
      position: relative;
      z-index: 1;
    }

    .final-love {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2000;
      transform: translate(-50%, -50%) rotate(-6deg) scale(0.82);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      font-family: "Snell Roundhand", "Brush Script MT", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(42px, 10vw, 82px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.92;
      color: #ff1685;
      -webkit-text-fill-color: #ff1685;
      -webkit-text-stroke: 0px transparent;
      text-shadow:
        0 0 8px rgba(255,255,255,0.28),
        0 0 38px rgba(255, 22, 133, 0.68),
        0 12px 38px rgba(255, 22, 133, 0.30);
      mix-blend-mode: normal;
      filter:
        saturate(1.22)
        brightness(1.08)
        drop-shadow(0 0 18px rgba(255,255,255,0.58));
    }

    .final-love.show {
      animation:
        finalLoveIn 1.4s cubic-bezier(.18,.9,.2,1) forwards,
        finalLoveFloat 4.8s ease-in-out 1.4s infinite,
        finalLoveOut 1.4s ease-in-out 8.4s forwards;
    }

    .caption {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 380px;
      margin: -6px auto 0;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      color: #ff4fa2;
      text-align: center;
      font-family: "Snell Roundhand", "Brush Script MT", "Apple Chancery", "Segoe Script", cursive;
      font-size: clamp(28px, 6.4vw, 38px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.08;
      transform: rotate(-2deg);
      text-shadow:
        0 1px 0 rgba(255,255,255,.8),
        0 4px 14px rgba(255, 95, 170, 0.14);
      -webkit-text-stroke: 0.2px rgba(255, 79, 162, 0.18);
      animation: cardIn 700ms cubic-bezier(.2,.9,.2,1) 1.1s both;
      flex: 0 0 auto;
    }

    @keyframes videoCardFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(-0.45deg) scale(1);
      }
      50% {
        transform: translate3d(0, -7px, 0) rotate(0.45deg) scale(1.012);
      }
    }

    @keyframes videoCardGlow {
      0%, 100% {
        box-shadow:
          0 28px 76px rgba(148, 197, 58, 0.22),
          0 16px 42px rgba(255, 90, 168, 0.20),
          inset 0 1px 0 rgba(255, 255, 255, 0.96);
      }
      50% {
        box-shadow:
          0 34px 88px rgba(148, 197, 58, 0.30),
          0 20px 52px rgba(255, 90, 168, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.98);
      }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.96); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes finalLoveIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72) rotate(-6deg);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(-6deg);
        filter: blur(0px);
      }
    }

    @keyframes finalLoveFloat {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0px) rotate(-6deg);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-10px) rotate(-4deg);
      }
    }

    @keyframes finalLoveOut {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(-6deg);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92) rotate(-8deg);
        filter: blur(10px);
      }
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(.72) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) * .82), calc(var(--y) * .82), 0) scale(1) rotate(calc(var(--r) * .7));
      }
      82% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) translate3d(var(--x), var(--y), 0) scale(1) rotate(var(--r));
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y)), 0) scale(.98) rotate(var(--r));
      }
    }

    @media (max-height: 720px) {
      .page {
        gap: 12px;
      }

      .title {
        font-size: clamp(34px, 12vw, 50px);
      }

      .character-card {
        width: min(54vw, 210px);
        border-radius: 30px;
      }

      .stage {
        height: 50svh;
        min-height: 365px;
      }

      .caption {
        font-size: 24px;
        padding: 0;
        margin: -4px auto 0;
      }
    }
  </style>
</head>

<body>

  <script>
    const messages = [
      "С днём рождения, Даная! 🎉✨",
      "Даная, happy birthday! 🎂💖",
      "Пусть сегодня будет вау! 🎊",
      "И весь год тоже! 🌟",
      "Улыбок до ушей 😄💫",
      "Кайфа от каждого дня ☀️✨",
      "Побольше поводов радоваться 🎀",
      "Поменьше поводов париться 🫶",
      "Легкости во всем 🕊️",
      "Удачи во всех начинаниях 🚀",
      "Пусть всё складывается красиво 💎",
      "Больше смеха 😂💖",
      "Больше приключений! 🌍",
      "Больше классных историй! 📸✨",
      "Пусть желания исполняются! 💫",
      "Чмок! 👄💕",
      "Хороших людей рядом 🫂",
      "Верных друзей рядом 💛",
      "Чтобы всё у тебя получалось 🌈",
      "Ярких моментов ✨🎀",
      "Самых теплых вечеров с Террочкой! 🐶💞",
      "Даная, будь счастлива! 🌸",
      "🥳🎉💃",
      "Пусть жизнь будет сладкой 🎂🍓",
      "🍰🧁🍓",
      "Приятных сюрпризов 🎁🔥",
      "🎈🎈🎈🎈🎈",
      "Делай что нравится 💅✨",
      "💐🌷🌸",
      "Ты самая красивая! Цвети 💐💖",
      "Сияй! ✨💎",
      "Много энергии! ⚡💥",
      "Классных путешествий! ✈️🌍",
      "Больше вдохновения 🎨💫",
      "С днём рождения! Н. и Л. 🚀💖"
    ];

    const characterVideo = document.querySelector(".character-card video");

    let messageIndex = 0;
    let bubbleTimer = null;
    const order = shuffle(messages.length);

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function spawnBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span>${message}</span>`;

      const card = document.querySelector(".character-card");
      const cardRect = card.getBoundingClientRect();
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const centerX = cardRect.left + cardRect.width / 2;
      const centerY = cardRect.top + cardRect.height / 2;

      const isSmallScreen = screenWidth < 430;
      const marginX = isSmallScreen ? 92 : 104;
      const safeTop = Math.max(86, Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat")) || 0);
      const safeBottom = isSmallScreen ? 132 : 118;
      const minX = marginX;
      const maxX = screenWidth - marginX;
      const minY = safeTop;
      const maxY = screenHeight - safeBottom;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function safeRandomX(min, max) {
        const left = clamp(min, minX, maxX);
        const right = clamp(max, minX, maxX);
        if (right <= left) return clamp((min + max) / 2, minX, maxX);
        return randomBetween(left, right);
      }

      function safeRandomY(min, max) {
        const top = clamp(min, minY, maxY);
        const bottom = clamp(max, minY, maxY);
        if (bottom <= top) return clamp((min + max) / 2, minY, maxY);
        return randomBetween(top, bottom);
      }

      const zones = [
        {
          startX: clamp(centerX + randomBetween(-28, 28), minX, maxX),
          startY: clamp(cardRect.top + 12, minY, maxY),
          targetX: safeRandomX(88, screenWidth - 88),
          targetY: safeRandomY(safeTop, cardRect.top - 20)
        },
        {
          startX: clamp(cardRect.left + 12, minX, maxX),
          startY: clamp(centerY + randomBetween(-70, 50), minY, maxY),
          targetX: safeRandomX(88, cardRect.left - 24),
          targetY: safeRandomY(132, screenHeight - safeBottom)
        },
        {
          startX: clamp(cardRect.right - 12, minX, maxX),
          startY: clamp(centerY + randomBetween(-70, 50), minY, maxY),
          targetX: safeRandomX(cardRect.right + 24, screenWidth - 88),
          targetY: safeRandomY(132, screenHeight - safeBottom)
        },
        {
          startX: clamp(centerX + randomBetween(-32, 32), minX, maxX),
          startY: clamp(cardRect.bottom - 10, minY, maxY),
          targetX: safeRandomX(88, screenWidth - 88),
          targetY: safeRandomY(cardRect.bottom + 24, screenHeight - safeBottom)
        }
      ];

      const zone = zones[Math.floor(Math.random() * zones.length)];

      bubble.style.setProperty("--start-x", `${zone.startX}px`);
      bubble.style.setProperty("--start-y", `${zone.startY}px`);
      bubble.style.setProperty("--x", `${zone.targetX - zone.startX}px`);
      bubble.style.setProperty("--y", `${zone.targetY - zone.startY}px`);
      bubble.style.setProperty("--drift-x", `${randomBetween(-4, 4).toFixed(1)}px`);
      bubble.style.setProperty("--drift-y", `${randomBetween(-4, 4).toFixed(1)}px`);
      bubble.style.setProperty("--r", `${randomBetween(-5, 5).toFixed(2)}deg`);
      bubble.style.setProperty("--duration", `${randomBetween(7.2, 8.8).toFixed(2)}s`);

      document.body.appendChild(bubble);

      bubble.addEventListener("animationend", () => {
        bubble.remove();
      }, { once: true });
    }

    function tick() {
      if (messageIndex >= messages.length) {
        if (bubbleTimer) {
          window.clearInterval(bubbleTimer);
          bubbleTimer = null;
        }

        window.setTimeout(() => {
          const finalLove = document.getElementById("finalLove");
          if (finalLove) {
            finalLove.classList.add("show");
          }
        }, 900);

        return;
      }

      const index = order[messageIndex];
      spawnBubble(messages[index]);
      messageIndex += 1;
    }

    function startMessages() {
      tick();
      bubbleTimer = window.setInterval(tick, 540);
    }

    function init() {
      if (characterVideo) {
        characterVideo.muted = true;
        characterVideo.play().catch(() => {});
      }

      window.setTimeout(startMessages, 450);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
